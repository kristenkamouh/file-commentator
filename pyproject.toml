[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "file-commentator"
dynamic = ["version"]
description = "Add, check, and remove a header comment at the top of files, in the right comment syntax for each language."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["header", "license", "copyright", "comment", "cli", "pre-commit"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kristenkamouh/file-commentator"
Issues = "https://github.com/kristenkamouh/file-commentator/issues"
Changelog = "https://github.com/kristenkamouh/file-commentator/blob/main/CHANGELOG.md"

[project.scripts]
commentator = "file_commentator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.15"]

[tool.hatch.version]
path = "src/file_commentator/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
